name: Build, Push and Update ArgoCD Manifest

on:
  push:
    branches:
      - main

jobs:
  build-push-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract git commit short SHA
        id: get_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/autoservice1:${{ env.SHORT_SHA }}

      - name: Update ArgoCD manifest
        run: |
          MANIFEST_FILE="k8s/django/deployment.yaml"
          sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/autoservice1:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/autoservice1:${{ env.SHORT_SHA }}|g" $MANIFEST_FILE
          cat $MANIFEST_FILE

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add k8s/django/deployment.yaml
          git commit -m "Update image tag to ${{ env.SHORT_SHA }}"
          git push
