{% extends "base.html" %}{% load static %}{% block content %}<div class="card">    <div class="card-body">        <div class="d-flex justify-content-between align-items-center mb-4">            <h2>Прайс-лист</h2>            <small class="text-muted">Дата обновления: {{ price.created_at|date:"d.m.Y" }}</small>        </div>                {% if price %}        <div class="text-center">            <img src="{{ price.image.url }}"                  class="img-fluid rounded shadow"                 alt="Актуальный прайс-лист"                 style="max-width: 800px;">            <div class="mt-3">                <a href="{{ price.image.url }}"                    class="btn btn-primary"                   download>                   <i class="bi bi-download"></i> Скачать прайс                </a>            </div>        </div>        {% else %}        <div class="alert alert-warning">Прайс-лист временно недоступен</div>        {% endif %}    </div></div>{% endblock %}
